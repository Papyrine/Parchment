name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Read only by default. The publish job asks for the OIDC token it needs itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build:
    # Windows: the tests rely on the bundled fonts installed below.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # SponsorCheck bundles the sponsor list during pack on non-PR builds and needs a
      # classic PAT (org secret). PR builds skip it.
      GitHubToken: ${{ secrets.SPONSOR_CHECK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install fonts
        shell: pwsh
        run: |
          # Install bundled fonts (direct copy avoids COM Shell hangs on CI).
          # Each font is validated via System.Drawing before install; corrupt files
          # (e.g. TTFs mangled by Git CRLF conversion) will fail the build here
          # rather than surfacing as confusing "font not found" errors at test time.
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          $fontsPath = "src/Fonts"
          $winFonts = "$env:WINDIR\Fonts"
          $regKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
          Write-Host "Font source: $fontsPath"
          $files = @(Get-ChildItem -Path $fontsPath -Recurse -File |
              Where-Object { $_.Extension -in '.ttf', '.otf' })
          Write-Host "Found $($files.Count) font files"
          if ($files.Count -eq 0)
          {
              throw "No font files found in $fontsPath"
          }
          foreach ($file in $files)
          {
              $pfc = New-Object System.Drawing.Text.PrivateFontCollection
              try
              {
                  $pfc.AddFontFile($file.FullName)
                  if ($pfc.Families.Count -eq 0 -or [string]::IsNullOrEmpty($pfc.Families[0].Name))
                  {
                      throw "Font file '$($file.FullName)' has no family name (likely corrupt — check .gitattributes marks *.ttf/*.otf as binary)"
                  }
                  $family = $pfc.Families[0].Name
              }
              finally
              {
                  $pfc.Dispose()
              }
              Write-Host "Installing $($file.Name) (family: '$family')"
              Copy-Item $file.FullName -Destination $winFonts -Force
              $fontName = [System.IO.Path]::GetFileNameWithoutExtension($file.Name)
              $fontType = if ($file.Extension -eq ".otf") { "OpenType" } else { "TrueType" }
              New-ItemProperty -Path $regKey -Name "$fontName ($fontType)" -Value $file.Name -PropertyType String -Force | Out-Null
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Keyed on everything that decides the package graph. restore-keys lets a changed graph start
      # from the previous cache rather than empty.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/*.fsproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tag is the version: tag 1.2.3 (or v1.2.3) builds 1.2.3. Other builds use the
      # Version in src/Directory.Build.props.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "VERSION_ARGUMENT=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Packs as a side effect (GeneratePackageOnBuild) into ./nugets. Only Parchment is
      # packable there; ParchmentModel, SourceGenerator, Benchmarks and tests are not.
      - name: Build
        run: dotnet build src --configuration Release ${{ env.VERSION_ARGUMENT }}

      # Same Version so IntegrationTests' Parchment PackageVersion resolves the nupkg just built.
      - name: Build integration tests
        run: dotnet build IntegrationTests --configuration Release ${{ env.VERSION_ARGUMENT }}

      - name: Test Parchment.Tests
        run: dotnet run --project src/Parchment.Tests --configuration Release --no-build -- --report-trx

      - name: Test Parchment.SourceGenerator.Tests
        run: dotnet run --project src/Parchment.SourceGenerator.Tests --configuration Release --no-build -- --report-trx

      - name: Run integration tests
        run: dotnet run --project IntegrationTests/IntegrationTests --configuration Release --no-build -- --report-trx

      - name: Upload received on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: received
          path: '**/*.received.*'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      - name: Upload packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: nugets/Parchment.*.nupkg
          if-no-files-found: warn
          retention-days: 30

  # Trusted publishing: no stored API key. nuget.org validates GitHub's OIDC token against the
  # policy naming this repository and this workflow file, and returns a key good for an hour.
  publish:
    needs: build
    environment: nuget
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: packages

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: SimonCropp

      - name: Push to nuget.org
        run: >
          dotnet nuget push "packages/**/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
